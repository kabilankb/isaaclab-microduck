[package]
version = "0.1.0"
category = "simulation"
title = "Microduck Policy Player"
description = "Load a trained Microduck checkpoint and run it in the Isaac Sim viewport."
authors = ["kabilankb"]
repository = "https://github.com/kabilankb/isaaclab-microduck"
keywords = ["isaac", "microduck", "reinforcement-learning", "policy", "newton"]
readme = "docs/README.md"

[core]
# The extension holds a live simulation env; hot-reload would leak it.
reloadable = false

# Minimal on purpose. The panel needs a UI toolkit and the app's update stream, and
# nothing else. Listing an extension this Kit app does not ship makes dependency
# resolution fail with "No versions of microduck.policy.player that satisfies", which
# reads as if THIS extension were malformed rather than one of its dependencies being
# absent -- `omni.kit.window.filepicker` is not present in the app play.py launches.
# Registering with the Examples Browser is what makes this discoverable -- fighting
# `--ext-folder` was a dead end (Kit reported "Available packages: (empty)" for both
# the `=` and space forms). The browser and base-sample extensions ship with Isaac Sim.
[dependencies]
# NOT omni.kit.app: it is a core module, always present, and declaring it as an
# extension dependency fails resolution with "No versions of omni.kit.app that
# satisfies" -- which reads as if it were missing rather than misdeclared.
"omni.ui" = {}
"isaacsim.examples.browser" = {}
"isaacsim.examples.base" = {}

[[python.module]]
name = "microduck.policy.player"
